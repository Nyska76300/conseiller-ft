name: Tests de non-régression

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Playwright et Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Vérifier le fichier de veille
        run: python -m json.tool reglementation/maj.json > /dev/null
      - name: Vérifier les versions des fichiers (assets)
        run: python tools/version.py
      - name: Vérifier les thèmes de couleurs
        run: python tools/palettes.py --check
      - name: Lancer les tests (calculs, outils, affichage)
        run: python tools/regression.py
      - name: Relire les modèles de mails (champs, fautes, liens)
        run: python tools/mails.py --online
      - name: Vérifier la lisibilité des thèmes de couleurs
        run: python tools/contrast.py --strict
      - name: Récupérer les captures du dernier passage
        uses: actions/cache@v4
        with:
          path: visual-ref
          key: visual-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            visual-${{ github.ref_name }}-
            visual-main-
      - name: Vérifications visuelles (captures, images, icônes)
        run: |
          pip install pillow
          python tools/visual.py visual-out visual-ref
      - name: Joindre les captures et les différences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: visual-out
          if-no-files-found: ignore
      - name: Garder ces captures comme référence pour le prochain passage
        if: always()
        run: rm -rf visual-ref && cp -r visual-out visual-ref || true
